<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Management</title>
    <link rel="stylesheet" href="/Cadastro-e-Consulta-Gitflow/styles/cadVenda.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">Sales<span>Hub</span> Pro</div>
                <nav>
                    <a href="#dashboard">Dashboard</a>
                    <a href="#sales">Sales</a>
                    <a href="#reports">Reports</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Dashboard Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Sales</div>
                <div class="stat-value" id="totalSales">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Items</div>
                <div class="stat-value" id="totalItems">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Transactions</div>
                <div class="stat-value" id="totalTransactions">0</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Registration Form -->
            <div class="card">
                <h2>📝 Register New Sale</h2>
                <div class="alert" id="alert"></div>

                <form id="salesForm">
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" required placeholder="Enter product name">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" min="1" required placeholder="0">
                        </div>
                        <div class="form-group">
                            <label for="unitPrice">Unit Price ($)</label>
                            <input type="number" id="unitPrice" step="0.01" min="0" required placeholder="0.00">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Food">Food</option>
                            <option value="Services">Services</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="saleDate">Date</label>
                        <input type="date" id="saleDate" required>
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" rows="3" placeholder="Additional notes..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary">✓ Register Sale</button>
                    <button type="reset" class="btn-secondary">Clear Form</button>
                </form>
            </div>

            <!-- Summary -->
            <div class="card">
                <h2>📊 Current Transaction</h2>
                <div id="summary" class="empty-state">
                    <p>Fill the form to see transaction summary</p>
                </div>
            </div>
        </div>

        <!-- Sales History Table -->
        <div class="card table-section">
            <h2>📋 Sales History</h2>
            <table id="salesTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Unit Price</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="7" class="empty-state">No sales registered yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/Cadastro-e-Consulta-Gitflow/scripts/cadVenda.js"></script>
</body>

</html>
